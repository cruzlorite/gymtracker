<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GymTracker</title>
  <meta name="description" content="Registra tus entrenos serie a serie y compite con tus amigos. · Log every set and compete with your friends.">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js 4.4.1 served from this repo: no third party can inject code that sees the Google token. -->
  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="sheet"></div>
  <div id="restbar" class="restbar" role="timer"></div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite" popover="manual"></div>
</body>
</html>
